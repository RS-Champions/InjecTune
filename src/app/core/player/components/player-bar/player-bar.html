@if (playerStore.currentTrack(); as track) {
  <div class="player-bar">
    <div class="player-bar__track">
      <img class="player-bar__cover" [src]="track.image" [alt]="track.name" />
      <div class="player-bar__info">
        <span class="player-bar__title">{{ track.name }}</span>
        <span class="player-bar__artist">{{ track.artist_name }}</span>
      </div>
    </div>

    <div class="player-bar__center">
      <div class="player-bar__controls">
        <button
          tuiIconButton
          iconStart="@tui.shuffle"
          appearance="ghost"
          size="s"
          type="button"
          tuiHint="{{ playerStore.shuffle() ? 'Restore' : 'Shuffle' }}"
          tuiHintSize="s"
          tuiHintDirection="start"
          tuiHintAppearance="neutral"
          [class.active]="playerStore.shuffle()"
          aria-label="Shuffle"
          (click)="toggleShuffle()"
        ></button>

        <button
          tuiIconButton
          iconStart="@tui.skip-back"
          appearance="ghost"
          size="s"
          type="button"
          tuiHint="Previous"
          tuiHintDirection="top"
          tuiHintAppearance="neutral"
          [disabled]="!playerStore.hasPrevious()"
          aria-label="Previous"
          (click)="audio.previous()"
        ></button>

        <button
          tuiIconButton
          [iconStart]="playerStore.isPlaying() ? '@tui.pause' : '@tui.play'"
          appearance="primary"
          size="m"
          type="button"
          [class.loading]="playerStore.isLoading()"
          aria-label="Play or Pause"
          (click)="togglePlay()"
        ></button>

        <button
          tuiIconButton
          iconStart="@tui.skip-forward"
          appearance="ghost"
          size="s"
          type="button"
          tuiHint="Next"
          tuiHintDirection="top"
          tuiHintAppearance="neutral"
          [disabled]="!playerStore.hasNext()"
          aria-label="Next"
          (click)="audio.next()"
        ></button>

        <button
          tuiIconButton
          [iconStart]="repeatIcon"
          appearance="ghost"
          size="s"
          type="button"
          tuiHint="Repeat"
          tuiHintDirection="end"
          tuiHintAppearance="neutral"
          [class.active]="playerStore.repeat() !== 'off'"
          aria-label="Repeat"
          (click)="toggleRepeat()"
        ></button>
      </div>

      <div class="player-bar__progress">
        <span class="player-bar__time">
          {{ playerStore.currentTime() | formatDuration }}
        </span>

        <input
          tuiSlider
          class="player-bar__slider"
          type="range"
          min="0"
          [max]="playerStore.duration()"
          step="1"
          [value]="progressValue"
          (input)="onProgressInput(progressInput.value)"
          (change)="onProgressChange(progressInput.value)"
          aria-label="Playback progress"
          #progressInput
        />

        <span class="player-bar__time">
          {{ playerStore.duration() | formatDuration }}
        </span>
      </div>
    </div>

    <div class="player-bar__right">
      <button
        tuiIconButton
        iconStart="@tui.list-music"
        appearance="ghost"
        size="s"
        type="button"
        tuiHint="Play Queue"
        tuiHintSize="s"
        tuiHintDirection="top"
        tuiHintAppearance="neutral"
        aria-label="Queue"
        (click)="toggleQueue()"
      ></button>
      <tui-icon class="player-bar__volume-icon" [icon]="playerStore.volume() === 0 ? '@tui.volume-x' : '@tui.volume-2'" />
      <input
        tuiSlider
        class="player-bar__volume-slider"
        type="range"
        min="0"
        max="100"
        step="1"
        [value]="volumePercent"
        (change)="onVolumeChange(volumeInput.value)"
        aria-label="Volume"
        #volumeInput
      />
    </div>
  </div>
}

<tui-drawer
  *tuiPopup="queueOpen()"
  class="queue-drawer"
  direction="end"
  [overlay]="true"
  (click.self)="queueOpen.set(false)"
>
  <app-player-queue (closeQueuePanel)="queueOpen.set(false)" />
</tui-drawer>
