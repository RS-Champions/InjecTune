<button class="queue-item" [class.queue-item--active]="isActive()" type="button" (click)="selectTrack.emit()">
  <span class="queue-item__index">
    @if (isActive()) {
      <tui-icon icon="@tui.volume-2" class="queue-item__playing-icon" />
    } @else {
      {{ index() }}
    }
  </span>

  @if (track().image) {
    <img [src]="track().image" [alt]="track().name" class="queue-item__cover" loading="lazy" />
  } @else {
    <span class="queue-item__cover_default">
      <tui-icon icon="@tui.music" />
    </span>
  }
  <span class="queue-item__info">
    <span class="queue-item__title">{{ track().name }}</span>
    <span class="queue-item__artist">{{ track().artist_name }}</span>
  </span>
  <span class="queue-item__duration">{{ track().duration | formatDuration }}</span>
</button>
