<div class="main-layout" [class.mobile]="isMobile()">
  @if (!isMobile()) {
    <aside class="sidebar-wrapper">
      <app-sidebar [navigationItems]="navigationItems"></app-sidebar>
    </aside>
  }

  <div class="content-wrapper">
    @if (isMobile()) {
      <header class="mobile-header">
        <app-hamburger (toggleSidebar)="onToggleSidebar()"></app-hamburger>
        <h1 class="mobile-title">InjecTune</h1>
      </header>
    } @else {
      <app-header />
    }

    <main class="page-content">
      <router-outlet></router-outlet>
      <app-player-bar></app-player-bar>
    </main>
  </div>

  @if (isMobile() && sidebarOpen()) {
    <div
      class="backdrop"
      (click)="onBackdropClick()"
      tabindex="0"
      role="button"
      (keydown.enter)="onBackdropClick()"
      (keydown.space)="onBackdropClick()"
    ></div>
  }

  @if (isMobile()) {
    <aside class="sidebar-wrapper sidebar-mobile" [class.open]="sidebarOpen()">
      <app-sidebar [navigationItems]="navigationItems"></app-sidebar>
    </aside>
  }
</div>
