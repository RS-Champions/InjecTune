@switch (albumResource.status()) {
  @case ('local')
  @case ('resolved') {
    @if (album(); as alb) {
      <app-album-header [album]="alb" [isPlayingAll]="store.isPlaying()" (playAll)="onPlayAll()" />

      <div class="content">
        <div class="track-list-header">
          <span>#</span>
          <span>TITLE</span>
          <span class="col-plays">PLAYS</span>
          <span class="col-duration">
            <tui-icon icon="@tui.clock" size="xs" />
          </span>
        </div>
        @for (item of alb.tracks; track item.id) {
          <app-album-track-card
            [track]="item"
            [isPlaying]="store.isPlaying() && currentTrack()?.id === item.id"
            (playTrack)="onPlay($event)"
            (pauseTrack)="audio.pause()"
          />
        }
      </div>
    } @else {
      <p class="empty-state">Album not found</p>
    }
  }
  @case ('error') {
    <p class="error-state">Failed to load album data. Please try again later.</p>
  }
  @default {
    <app-loading-skeleton [pageName]="pageName" [isLoading]="true" />
  }
}
