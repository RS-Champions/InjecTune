<div class="cover">
  <img class="cover" [src]="track().image" [alt]="track().name" />
</div>

<div class="description">
  <h2 class="title" tuiHint="{{ track().name }}">{{ track().name }}</h2>
  <a class="artist" [routerLink]="['/artist', track().artist_id]">{{ track().artist_name }}</a>

  <div class="meta">
    @if (track().album_id) {
      <a class="album" [routerLink]="['/album', track().album_id]">
        {{ track().album_name }}
      </a>
      <span class="separator">·</span>
    }
    <span class="duration">{{ track().duration | formatDuration }}</span>
    <span class="separator">·</span>
    <span class="play-count">{{ track().stats.listens_total | formatPlayCount }}</span>
  </div>

  <button
    tuiIconButton
    size="m"
    [appearance]="isPlaying() ? 'primary' : 'secondary'"
    [iconStart]="isPlaying() ? '@tui.pause' : '@tui.play'"
    class="play-btn"
    (click)="isPlaying() ? onPause() : onPlay()"
    [attr.aria-label]="isPlaying() ? 'Pause' : 'Play ' + track().name"
  ></button>
</div>
