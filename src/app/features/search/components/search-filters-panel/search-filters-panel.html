<div class="panel-header">
  <h2>Filters</h2>
  <button appearence="primary" size="xs" tuiButton type="button" aria-label="header button">
    <tui-icon icon="sliders-horizontal" size="xs" />
  </button>
</div>

<section class="section">
  <h3 class="section-title">GENRE</h3>

  <div class="genre-chips">
    @for (genre of genres; track genre) {
      <label tuiChip class="genre-chip" [appearance]="isGenreSelected(genre) ? 'accent' : 'outline'">
        <input hidden type="checkbox" [checked]="isGenreSelected(genre)" (change)="toggleGenre(genre)" />
        {{ genre }}
      </label>
    }
  </div>
</section>

<section class="section">
  <h3 class="section-title">DURATION</h3>

  <div class="duration-list">
    <label tuiLabel>
      <input tuiRadio type="radio" name="duration" [checked]="duration() === 'short'" (change)="duration.set('short')" />
      Under 3 min
    </label>
    <label tuiLabel>
      <input tuiRadio type="radio" name="duration" [checked]="duration() === 'medium'" (change)="duration.set('medium')" />
      3 – 5 min
    </label>
    <label tuiLabel>
      <input tuiRadio type="radio" name="duration" [checked]="duration() === 'long'" (change)="duration.set('long')" />
      Over 5 min
    </label>
  </div>
</section>

<section class="section">
  <h3 class="section-title">SORT BY</h3>

  <tui-textfield tuiChevron tuiTextfieldSize="m" [content]="sortLabel" [stringify]="stringify">
    <input placeholder="Select a category" tuiSelect [ngModel]="selectedSort()" (ngModelChange)="selectedSort.set($event)" />
    <tui-data-list-wrapper *tuiDropdown [items]="sortOptions" [itemContent]="sortLabel" />
  </tui-textfield>
  <ng-template #sortLabel let-item>{{ item.label }}</ng-template>
</section>
