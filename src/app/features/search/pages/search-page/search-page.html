<div class="search-page__results">
  @for (item of (searchTracks | async)?.results; track item.id) {
    <app-search-track-card
      [track]="item"
      [isPlaying]="currentTrack()?.id === item.id"
      (playTrack)="onPlay($event)"
      (pauseTrack)="onPause($event)"
    ></app-search-track-card>
  }
</div>
