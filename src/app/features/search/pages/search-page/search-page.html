<tui-textfield iconStart="@tui.search">
  <input
    placeholder="Search traks, artists, albums..."
    tuiInput
    aria-label="Search tracks, artists, albums"
    [ngModel]="searchQuery()"
    (ngModelChange)="searchQuery.set($event)"
  />
  <tui-icon tuiTooltip="Start type trak, artist, album..." />
</tui-textfield>
<div class="search-page">
  <div class="filters"></div>

  <div class="content">
    <div class="top-result"></div>

    <div class="results">
      @switch (searchState().status) {
        @case ('idle') {}
        @case ('loading') {
          <div class="loader">Loading...</div>
        }
        @case ('success') {
          @for (item of successState!.results; track item.id) {
            <app-search-track-card
              [track]="item"
              [isPlaying]="currentTrack()?.id === item.id"
              (playTrack)="onPlay($event)"
              (pauseTrack)="onPause($event)"
            ></app-search-track-card>
          }
        }
        @case ('empty') {
          <p class="empty-state">No tracks found for "{{ searchQuery() }}"</p>
        }
        @case ('error') {
          <p class="error-state">{{ errorMessage }}</p>
        }
      }
    </div>
  </div>
</div>
