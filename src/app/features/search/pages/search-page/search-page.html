<tui-textfield iconStart="@tui.search">
  <input
    placeholder="Search tracks, artists, albums..."
    tuiInput
    [ngModel]="searchQuery()"
    (ngModelChange)="searchQuery.set($event)"
  />

  <tui-icon tuiTooltip="Start typing track, artist, album..." />
</tui-textfield>

<div class="search-page">
  <div class="filters"></div>

  <div class="content">
    <div class="top-result"></div>

    <div class="results">
      @if (searchResource.isLoading()) {
        <div class="loader">Loading...</div>
      } @else if (errorMessage) {
        <p class="error-state">{{ errorMessage }}</p>
      } @else if (successState) {
        @for (item of successState.results; track item.id) {
          <app-search-track-card
            [track]="item"
            [isPlaying]="currentTrack()?.id === item.id"
            (playTrack)="onPlay($event)"
            (pauseTrack)="onPause($event)"
          ></app-search-track-card>
        }
      } @else if (debouncedQuery().trim()) {
        <p class="empty-state">No tracks found for "{{ debouncedQuery() }}"</p>
      }
    </div>
  </div>
</div>
