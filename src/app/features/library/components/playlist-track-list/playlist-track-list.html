<div class="header" aria-hidden="true">
  <span class="col-num">#</span>
  <span class="col-drag"></span>
  <span class="col-title">TITLE</span>
  <span class="col-album">ALBUM</span>
  <span class="col-dur">
    <tui-icon icon="@tui.clock" />
  </span>
  <span class="col-actions"></span>
</div>

<div class="divider"></div>

<ul class="items" role="list" cdkDropList [cdkDropListData]="displayTracks" (cdkDropListDropped)="onDrop($event)">
  @for (item of displayTracks; track item.id; let index = $index) {
    <li class="item" role="listitem" cdkDrag [cdkDragData]="item" (cdkDragStarted)="onDragStarted()">
      <!-- Drag preview shown while dragging -->
      <div *cdkDragPlaceholder class="drag-placeholder"></div>

      <span class="num label-sm" aria-hidden="true">{{ index + 1 }}</span>
      <app-playlist-track-card
        [track]="item"
        [isPlaying]="isTrackPlaying(item)"
        [isDraggable]="true"
        (playTrack)="trackPlay.emit($event)"
        (pauseTrack)="trackPause.emit($event)"
        (removeTrack)="trackRemove.emit($event)"
      />
    </li>
  }
</ul>
