@let item = playlist();

<button type="button" class="cover" (click)="playlistClick.emit()">
  @if (item.cover) {
    <img [src]="item.cover" [alt]="item.name" />
  } @else {
    <span class="cover-placeholder">
      <tui-icon icon="@tui.heart" />
    </span>
  }
  <button
    type="button"
    tuiIconButton
    iconStart="@tui.pencil"
    appearance="custom-secondary"
    size="s"
    class="edit-btn"
    (click)="$event.stopPropagation(); editClick.emit()"
    aria-label="Edit playlist"
  ></button>
</button>
<div class="info">
  <span class="title-md name">{{ item.name }}</span>
  <span class="label-sm meta">{{ item.meta }}</span>
</div>
