<header class="page-header">
  <div class="page-header__text">
    <h1 class="display-lg">Your Library</h1>
    <p class="body-md page-subtitle">Organize your music and podcasts</p>
  </div>
  <button type="button" tuiButton appearance="outline" size="s" iconStart="@tui.sliders-horizontal">Filters</button>
</header>

<section class="library-section">
  <header class="section-header">
    <h2 class="headline-lg">Recently Played</h2>
    <span class="label-sm date-label">TODAY</span>
  </header>
  <div class="recent-scroll">
    @for (item of recentTracks; track item.id) {
      <button type="button" class="recent-item" (click)="onTrackClick(item)">
        <app-music-card [data]="{ cover: item.cover, title: item.title, subtitle: item.subtitle }" [isActive]="false" />
      </button>
    }
  </div>
</section>

<section class="library-section">
  <h2 class="headline-lg">Playlists</h2>
  <div class="playlists-grid">
    <button type="button" class="create-card" (click)="onCreatePlaylist()">
      <span class="create-icon">
        <tui-icon icon="@tui.plus" />
      </span>
      <span class="create-label">Create Playlist</span>
    </button>
    @for (playlist of playlists; track playlist.id) {
      <app-playlist-card [playlist]="playlist" (playlistClick)="onPlaylistClick(playlist)" />
    }
  </div>
</section>
