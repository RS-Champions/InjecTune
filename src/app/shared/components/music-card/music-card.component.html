@let musicData = data();

<div class="image-wrapper">
  <img [src]="musicData.cover" [alt]="musicData.title" class="card-image" />
  <div class="overlay"></div>
  <div class="icon">
    @if (isActive()) {
      ❚❚
    } @else {
      ▶
    }
  </div>
  @if (isActive()) {
    <app-equalizer></app-equalizer>
  }
</div>

<div class="content">
  <h3 class="title">{{ musicData.title }}</h3>
  <p class="subtitle">{{ musicData.subtitle }}</p>
</div>
